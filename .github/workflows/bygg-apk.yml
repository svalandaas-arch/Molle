name: Bygg APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Bygg appen
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee bygg.log; then
            # Gjør feilene synlige som merknader på bygget
            grep -E "^e: |error:|What went wrong|^> |Exception" -A2 bygg.log | head -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk molle.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.${GITHUB_RUN_NUMBER}\"}" > versjon.json
          cat versjon.json

      - name: Last opp som vedlegg til bygget
        uses: actions/upload-artifact@v4
        with:
          name: molle-apk
          path: molle.apk

      - name: Legg ut som «siste versjon» (fast nedlastingslenke)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Siste versjon
          body: Last ned molle.apk på telefonen og installer.
          files: |
            molle.apk
            versjon.json
          make_latest: true
