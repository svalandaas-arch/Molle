name: Bygg APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Bygg appen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk molle.apk

      - name: Last opp som vedlegg til bygget
        uses: actions/upload-artifact@v4
        with:
          name: molle-apk
          path: molle.apk

      - name: Legg ut som «siste versjon» (fast nedlastingslenke)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Siste versjon
          body: Last ned molle.apk på telefonen og installer.
          files: molle.apk
          make_latest: true
